<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0; url=https://t.me/Nomad_pdd_bot?start=tiktok">
<title>Nomad PDD — TikTok</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #EDEEE8;
    --surface: #FFFFFF;
    --ink: #15171A;
    --ink-muted: #5B5F5E;
    --line: rgba(18,20,18,0.13);
    --accent: #8C6A16;
    --tg-blue: #229ED9;
    --tg-blue-dark: #1B84B5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #15171B;
      --surface: #1C1F23;
      --ink: #ECEDE7;
      --ink-muted: #9CA0A0;
      --line: rgba(255,255,255,0.11);
      --accent: #E3B04E;
      --tg-blue: #2AABEE;
      --tg-blue-dark: #229ED9;
    }
  }
  :root[data-theme="dark"] {
    --ground: #15171B;
    --surface: #1C1F23;
    --ink: #ECEDE7;
    --ink-muted: #9CA0A0;
    --line: rgba(255,255,255,0.11);
    --accent: #E3B04E;
    --tg-blue: #2AABEE;
    --tg-blue-dark: #229ED9;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    padding: 32px 20px;
  }

  .card {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 22px;
  }

  .wordmark {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.02em;
    color: var(--ink-muted);
    text-transform: uppercase;
  }
  .wordmark .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

  .status {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
  }

  .spinner {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 3px solid var(--line);
    border-top-color: var(--tg-blue);
    animation: spin 0.85s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; border-top-color: var(--line); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  h1 {
    margin: 0;
    font-size: 21px;
    font-weight: 800;
    line-height: 1.3;
    text-wrap: balance;
  }
  p.sub {
    margin: 0;
    font-size: 14.5px;
    color: var(--ink-muted);
    line-height: 1.5;
    max-width: 30ch;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 15px 22px;
    border-radius: 14px;
    background: linear-gradient(180deg, var(--tg-blue), var(--tg-blue-dark));
    color: #fff;
    font-family: inherit;
    font-weight: 700;
    font-size: 16px;
    text-decoration: none;
    border: none;
    box-shadow: 0 10px 24px -10px rgba(34,158,217,0.55);
  }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .btn svg { width: 21px; height: 21px; flex-shrink: 0; }

  .hint {
    font-size: 12.5px;
    color: var(--ink-muted);
  }
  .hint code {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 1px 5px;
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="wordmark"><span class="dot"></span>Nomad PDD</div>

    <div class="status">
      <div class="spinner" aria-hidden="true"></div>
      <h1>Открываем Telegram…</h1>
      <p class="sub">Если ничего не произошло за пару секунд — нажмите кнопку ниже.</p>
    </div>

    <a class="btn" id="openBtn" href="https://t.me/Nomad_pdd_bot?start=tiktok">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M21.5 3.5 2.7 10.9c-1.2.5-1.2 1.2-.2 1.5l4.8 1.5 1.8 5.6c.2.6.5.8.9.8.4 0 .6-.2.9-.5l2.5-2.4 4.9 3.6c.9.5 1.5.2 1.7-.8L22 4.6c.3-1.2-.4-1.7-1.5-1.1z" fill="#fff"/>
      </svg>
      Открыть в Telegram
    </a>

    <p class="hint">Ссылка: <code>t.me/Nomad_pdd_bot</code></p>
  </div>

  <script>
    var DEST = "https://t.me/Nomad_pdd_bot?start=tiktok";
    try {
      window.location.replace(DEST);
    } catch (e) {
      window.location.href = DEST;
    }
  </script>
</body>
</html>
